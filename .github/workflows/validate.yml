name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  locales:
    name: Locale and i18n checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate locales
        run: python3 tools/validate-locales.py
